<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقاتي الخاصة</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 40px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card h3 {
            margin-top: 0;
            color: #38bdf8;
        }
        .card p {
            color: #cbd5e1;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .loading {
            color: #94a3b8;
            text-align: center;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <h1>تطبيقاتي الخاصة</h1>
    <div class="subtitle">متجر التحميل المباشر والخفيف بصفر تعقيدات</div>

    <div class="container" id="apps-container">
        <div class="loading">جاري تحميل التطبيقات...</div>
    </div>

    <script>
        fetch('apps.json')
            .then(response => response.json())
            .then(apps => {
                const container = document.getElementById('apps-container');
                container.innerHTML = '';
                
                if (apps.length === 0) {
                    container.innerHTML = '<div class="loading">لا توجد تطبيقات مضافة حالياً.</div>';
                    return;
                }

                apps.forEach(app => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div>
                            <h3>${app.name}</h3>
                            <p>${app.description}</p>
                        </div>
                        <a href="${app.url}" class="btn" target="_blank">تحميل مباشر</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error loading apps:', error);
                document.getElementById('apps-container').innerHTML = '<div class="loading" style="color: #ef4444;">عفواً، حدث خطأ أثناء تحميل بيانات التطبيقات.</div>';
            });
    </script>

</body>
</html>
