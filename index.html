<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الشخصي للتطبيقات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #090d16;
            --surface-color: #111827;
            --surface-hover: #1f2937;
            --border-color: #1e293b;
            --border-hover: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            max-width: 700px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        .header .logo-icon {
            font-size: 48px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            position: relative;
            animation: fadeIn 1s ease-out;
        }

        .search-box input {
            width: 100%;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 20px 16px 50px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            animation: fadeIn 1.2s ease-out;
        }

        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--border-hover);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 16px;
        }

        .app-icon {
            width: 54px;
            height: 54px;
            background: var(--surface-hover);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent-color);
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .app-info h3 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .app-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--accent-gradient);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .state-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            body { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
        <h1>تطبيقاتي الخاصة</h1>
        <p>منصة التحميل المباشر الآمنة، بدون إعلانات أو تعقيدات.</p>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="ابحث عن تطبيق أو أداة...">
    </div>

    <div class="container" id="apps-container">
        <div class="state-message">جاري تحميل التطبيقات...</div>
    </div>

    <script>
        let allApps = [];

        fetch('apps.json')
            .then(response => response.json())
            .then(apps => {
                allApps = apps;
                renderApps(allApps);
            })
            .catch(error => {
                console.error('Error loading apps:', error);
                document.getElementById('apps-container').innerHTML = `
                    <div class="state-message" style="color: #ef4444;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 32px; margin-bottom: 10px; display: block;"></i>
                        عفواً، حدث خطأ أثناء جلب بيانات التطبيقات.
                    </div>`;
            });

        function renderApps(apps) {
            const container = document.getElementById('apps-container');
            container.innerHTML = '';
            
            if (apps.length === 0) {
                container.innerHTML = `
                    <div class="state-message">
                        <i class="fa-solid fa-box-open" style="font-size: 32px; margin-bottom: 10px; display: block;"></i>
                        لا توجد تطبيقات مطابقة لبحثك.
                    </div>`;
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-top">
                            <div class="app-icon">
                                <i class="${app.icon || 'fa-solid fa-cube'}"></i>
                            </div>
                            <div class="app-info">
                                <h3>${app.name}</h3>
                                <div class="app-meta">
                                    <span><i class="fa-solid fa-tag"></i> ${app.version || '1.0.0'}</span>
                                    <span>•</span>
                                    <span><i class="fa-solid fa-hard-drive"></i> ${app.size || 'مباشر'}</span>
                                </div>
                            </div>
                        </div>
                        <p>${app.description}</p>
                    </div>
                    <a href="${app.url}" class="btn" target="_blank">
                        <i class="fa-solid fa-download"></i> تحميل مباشر
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // Live Search functionality
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = allApps.filter(app => 
                app.name.toLowerCase().includes(term) || 
                app.description.toLowerCase().includes(term)
            );
            renderApps(filtered);
        });
    </script>

</body>
</html>
